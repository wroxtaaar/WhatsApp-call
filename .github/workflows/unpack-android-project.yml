name: Extract Android project and build APK

on:
  push:
    branches: [main]
    paths:
      - "CallRedirect.zip"
      - ".github/workflows/unpack-android-project.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-android-${{ github.repository }}
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project and remove ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "CallRedirect.zip"
          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "CallRedirect.zip" -d "$RUNNER_TEMP/android-project"
          PROJECT_DIR="$RUNNER_TEMP/android-project/CallRedirect"
          test -d "$PROJECT_DIR"
          cp -a "$PROJECT_DIR/." .
          rm -f "CallRedirect.zip"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The GitHub App token cannot push workflow files; add the app's build workflow separately.
          git reset -q -- .github/workflows/build.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android project and remove ZIP archive"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licences
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRedirect-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
